[project]
name = "pocketagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "typer",
]


[project.scripts]
pocket = "pocket.cli:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocket"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
